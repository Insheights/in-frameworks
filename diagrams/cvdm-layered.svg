<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="990" viewBox="0 0 1080 990" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Customer Value Delivery Model (CVDM)</title>
  <!--
    Layout
    - Element boxes are 192 x 48. Instance circles (B, C, ...) are 48 across (r=24) at x=750, 805, 860.
    - Layer bands (Customer Journey, Value Proposition, Value Stream) span x=120..900, 80 high.
    - Element column x=444..636 (centre 540): Customer/User, Journey Step A, Value A, Product/Service A, Value Stage A.
      Capability and Process are aligned with Value Stage A (x=444..636); Information Concept sits beside Process (x=700..892). Enables and operationalizes run straight
      at x=572, Value Stage A's right bottom point (bottom thirds: 508 participates in, 572 enables). Stakeholder under x=290.
    - Connection points are evenly spaced per edge (thirds of the edge where two arrows share it).
    - Left-margin lines: x=50 (experiences, delivers) and x=80 (undergoes). Right: x=700 (reaches, 4, 5), x=960 (1, 3).
    - Grey = work flow (verb, upright). Blue = feedback flow (italic), numbered 1-5 as a diagnostic sequence: experience feedback,
      journey insights, delivery learning, performance optimization, strategic signals (feedback.md).
      Loop 2 (journey insights) runs Customer Journey band -> Value Proposition band at x=300, left of the triggers line (x=360).
    - Edge labels have no background: they sit above horizontal lines and beside vertical lines.
  -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DCE2E8"/>
    </pattern>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8591"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A87D9"/>
    </marker>
    <style>
      .work  { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ag); }
      .fb    { fill: none; stroke: #3A87D9; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ab); }
      .lbl   { font-size: 13px; fill: #3B4652; }
      .lblf  { font-size: 13px; fill: #2F6FB5; font-style: italic; }
      .h     { font-size: 13px; font-weight: 700; }
      .t     { font-size: 13px; }
      .ti    { font-size: 13px; font-style: italic; }
      .c     { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .ct    { font-size: 13px; text-anchor: middle; }
      .dark  { fill: #2E3A46; }
      .wht   { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1080" height="990" fill="#F1F4F7"/>
  <rect width="1080" height="990" fill="url(#dots)"/>

  <!-- title -->
  <text x="120" y="40" font-size="20" font-weight="700" fill="#2E3A46">Customer Value Delivery Model (CVDM)</text>
  <text x="120" y="66" font-size="15" fill="#3B4652">Customer Journey | Value Stream | Value Delivery</text>
  <text x="120" y="88" font-size="12.5" fill="#3B4652">How organizations map customer journeys to value streams, ensuring customer needs trigger appropriate capabilities and</text>
  <text x="120" y="106" font-size="12.5" fill="#3B4652">processes that create and deliver value, with continuous feedback loops enabling journey insights, delivery learning,</text>
  <text x="120" y="124" font-size="12.5" fill="#3B4652">and performance optimization.</text>

  <!-- ===================== LAYER BANDS (drawn first) ===================== -->

  <rect x="120" y="250" width="780" height="80" rx="3" fill="#FCF3DC" stroke="#F0C350" stroke-width="2"/>
  <text class="h dark" x="130" y="272">Customer Journey</text>
  <text class="t dark" x="130" y="292">consists of Journey Steps</text>

  <rect x="120" y="380" width="780" height="80" rx="3" fill="#FAE6DA" stroke="#E8873C" stroke-width="2"/>
  <text class="h dark" x="130" y="402">Value Proposition</text>
  <text class="t dark" x="130" y="422">promises Values</text>

  <rect x="120" y="650" width="780" height="80" rx="3" fill="#F8DDE0" stroke="#D9465A" stroke-width="2"/>
  <text class="h dark" x="130" y="672">Value Stream</text>
  <text class="t dark" x="130" y="692">consists of Value Stages</text>

  <!-- ===================== WORK FLOW (verbs) ===================== -->

  <!-- Customer/User -> Value Proposition: experiences -->
  <path class="work" d="M444,172 H50 V406.7 H116"/>
  <text class="lbl" x="260" y="166" text-anchor="middle">experiences</text>

  <!-- Customer/User -> Customer Journey: undergoes -->
  <path class="work" d="M444,188 H80 V290 H116"/>
  <text class="lbl" x="260" y="206" text-anchor="middle">undergoes</text>

  <!-- Value Stream -> Value Proposition: delivers -->
  <path class="work" d="M120,690 H50 V433.3 H116"/>
  <text class="lbl" transform="translate(43,560) rotate(-90)" text-anchor="middle">delivers</text>

  <!-- Journey Step A -> Value Stage A: triggers -->
  <path class="work" d="M444,290 H360 V698 H440"/>
  <text class="lbl" x="402" y="284" text-anchor="middle">triggers</text>

  <!-- Value Stage A -> Value A: fulfills -->
  <path class="work" d="M444,682 H400 V420 H440"/>
  <text class="lbl" x="408" y="625">fulfills</text>

  <!-- Product/Service A -> Value A: delivers -->
  <path class="work" d="M540,524 V448"/>
  <text class="lbl" x="548" y="490">delivers</text>

  <!-- Value Stage A -> Product/Service A: experienced through -->
  <path class="work" d="M540,666 V576"/>
  <text class="lbl" x="548" y="625">experienced through</text>

  <!-- Value A -> Customer/User: reaches -->
  <path class="work" d="M636,412 H700 V188 H640"/>
  <text class="lbl" x="708" y="358">reaches</text>

  <!-- Stakeholder -> Value Stage A: participates in -->
  <path class="work" d="M290,790 V750 H508 V718"/>
  <text class="lbl" x="400" y="768" text-anchor="middle">participates in</text>

  <!-- Capability -> Value Stage A: enables -->
  <path class="work" d="M572,790 V718"/>
  <text class="lbl" x="580" y="768">enables</text>

  <!-- Process -> Capability: operationalizes -->
  <path class="work" d="M540,880 V842"/>
  <text class="lbl" x="556" y="866">operationalizes</text>

  <!-- 2. Customer Journey -> Value Proposition: where in the journey the promised value breaks -->
  <path class="fb" d="M300,330 V376"/>
  <text class="lblf" x="292" y="358" text-anchor="end">2. journey insights</text>

  <!-- ===================== FEEDBACK FLOW (numbered sequence) ===================== -->

  <!-- 1. Customer/User -> Value Proposition -->
  <path class="fb" d="M636,172 H960 V406.7 H904"/>
  <text class="lblf" x="790" y="166" text-anchor="middle">1. experience feedback</text>

  <!-- 5. Value Proposition -> Product/Service instances: strategic signals (consolidated by the product team for OSM to decide) -->
  <path class="fb" d="M900,433.3 H960 V690 H904"/>
  <text class="lblf" x="968" y="486">5. strategic</text>
  <text class="lblf" x="968" y="502">signals</text>

  <!-- 3. Value A -> Value Stage A: delivery learning -->
  <path class="fb" d="M636,428 H700 V682 H640"/>
  <text class="lblf" x="708" y="625">3. delivery learning</text>

  <!-- 4. Value Stage A -> Capability: performance optimization -->
  <path class="fb" d="M636,698 H700 V804 H640"/>
  <text class="lblf" x="708" y="768">4. performance optimization</text>

  <!-- ===================== ELEMENTS (192 x 48) ===================== -->

  <rect x="444" y="156" width="192" height="48" rx="3" fill="#F0C350"/>
  <text class="c dark" x="540" y="185">Customer/User</text>

  <rect x="444" y="266" width="192" height="48" rx="3" fill="#F0C350"/>
  <text class="c dark" x="540" y="295">Journey Step A</text>
  <circle cx="750" cy="290" r="24" fill="#F0C350"/><text class="ct dark" x="750" y="295">B</text>
  <circle cx="805" cy="290" r="24" fill="#F0C350"/><text class="ct dark" x="805" y="295">C</text>
  <circle cx="860" cy="290" r="24" fill="#F0C350"/><text class="ct dark" x="860" y="295">…</text>

  <rect x="444" y="396" width="192" height="48" rx="3" fill="#E8873C"/>
  <text class="c wht" x="540" y="425">Value A</text>
  <circle cx="750" cy="420" r="24" fill="#E8873C"/><text class="ct wht" x="750" y="425">B</text>
  <circle cx="805" cy="420" r="24" fill="#E8873C"/><text class="ct wht" x="805" y="425">C</text>
  <circle cx="860" cy="420" r="24" fill="#E8873C"/><text class="ct wht" x="860" y="425">…</text>

  <rect x="444" y="524" width="192" height="48" rx="3" fill="#26AE9E"/>
  <text class="c wht" x="540" y="553">Product/Service A</text>
  <circle cx="750" cy="548" r="24" fill="#26AE9E"/><text class="ct wht" x="750" y="553">B</text>
  <circle cx="805" cy="548" r="24" fill="#26AE9E"/><text class="ct wht" x="805" y="553">C</text>
  <circle cx="860" cy="548" r="24" fill="#26AE9E"/><text class="ct wht" x="860" y="553">…</text>

  <rect x="444" y="666" width="192" height="48" rx="3" fill="#CC4458"/>
  <text class="c wht" x="540" y="695">Value Stage A</text>
  <circle cx="750" cy="690" r="24" fill="#CC4458"/><text class="ct wht" x="750" y="695">B</text>
  <circle cx="805" cy="690" r="24" fill="#CC4458"/><text class="ct wht" x="805" y="695">C</text>
  <circle cx="860" cy="690" r="24" fill="#CC4458"/><text class="ct wht" x="860" y="695">…</text>

  <rect x="194" y="790" width="192" height="48" rx="3" fill="#26AE9E"/>
  <text class="c wht" x="290" y="819">Stakeholder</text>

  <rect x="444" y="790" width="192" height="48" rx="3" fill="#3F87DE"/>
  <text class="c wht" x="540" y="819">Capability</text>

  <rect x="444" y="880" width="192" height="48" rx="3" fill="#3F87DE"/>
  <text class="c wht" x="540" y="909">Process</text>

  <!-- Information Concept (README, CVDM guide Step 3): named business information (the terms of PTS Business Domain Language);
       the arrow is its flow, feeding a capability at the moment the customer needs it.
       Sits on the Process row; its arrow enters Capability's right edge below loop 4 (loop 4 at y=804, feeds at y=828), clear of the x=700 line. -->
  <path class="work" d="M760,880 V828 H640"/>
  <text class="lbl" x="768" y="862">feeds</text>
  <rect x="700" y="880" width="192" height="48" rx="3" fill="#3F87DE"/>
  <text class="c wht" x="796" y="909">Information Concept</text>

  <!-- legend: top-right, same spot and layout in osm.svg, cvdm-layered.svg, pts-detailed.svg -->
  <text x="940" y="34" font-size="12" fill="#3B4652">work flow</text>
  <path class="work" d="M940,44 H1040"/>
  <text x="940" y="70" font-size="12" fill="#2F6FB5" font-style="italic">feedback flow</text>
  <path class="fb" d="M940,80 H1040"/>
  <text x="940" y="106" font-size="12" fill="#2F6FB5" font-style="italic">1–5 feedback sequence</text>

  <text x="525" y="968" font-size="13" fill="#2E3A46" text-anchor="middle">© 2026 Insheights LLC. All rights reserved.</text>
</svg>
