<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="560" viewBox="0 0 1140 560" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Insheights Integrated Value Creation System</title>
  <!--
    Layout
    - Product Mindset band (top) and Value Streams band (bottom) span x=60..1076.
    - Framework boxes, one row, 192 wide and 100 high (y=260..360): OSM x=60, PTS x=472, CVDM x=884; gaps of 220 for the labels.
    - Dashed lines from each box's centre (x=156, 568, 980): Product Mindset (brown, as in pts-detailed.svg) above; Value Streams (red) below.
    - Side pairs at y=293.3 (work) and 326.7 (feedback), thirds of the box height.
    - Grey = work flow, blue = feedback flow; labels above work lines and below feedback lines.
  -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DCE2E8"/>
    </pattern>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8591"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A87D9"/>
    </marker>
    <style>
      .work  { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ag); }
      .fb    { fill: none; stroke: #3A87D9; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ab); }
      .dg    { fill: none; stroke: #8A7B58; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .dr    { fill: none; stroke: #D9465A; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .lbl   { font-size: 13px; fill: #3B4652; text-anchor: middle; }
      .lblf  { font-size: 13px; fill: #2F6FB5; font-style: italic; text-anchor: middle; }
      .bh    { font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .bt    { font-size: 13px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1140" height="560" fill="#F1F4F7"/>
  <rect width="1140" height="560" fill="url(#dots)"/>

  <!-- title -->
  <text x="60" y="40" font-size="20" font-weight="700" fill="#2E3A46">Insheights Integrated Value Creation System</text>
  <text x="60" y="66" font-size="15" fill="#3B4652">OSM | PTS | CVDM</text>
  <text x="60" y="88" font-size="12.5" fill="#3B4652">The Insheights Integrated Value Creation System is how organizations define, build, and deliver value — from</text>
  <text x="60" y="106" font-size="12.5" fill="#3B4652">strategic intent to value — integrating existing practices into a coherent system.</text>

  <!-- legend: top-right, right edge aligned with the bands -->
  <text x="976" y="34" font-size="12" fill="#3B4652">work flow</text>
  <path class="work" d="M976,44 H1076"/>
  <text x="976" y="70" font-size="12" fill="#2F6FB5" font-style="italic">feedback flow</text>
  <path class="fb" d="M976,80 H1076"/>
  <text x="976" y="104" font-size="12" fill="#3B4652">underpins</text>
  <path class="dg" d="M976,112 H1076"/>
  <text x="976" y="130" font-size="12" fill="#3B4652">runs on</text>
  <path class="dr" d="M976,138 H1076"/>

  <!-- ===================== BANDS ===================== -->

  <rect x="60" y="160" width="1016" height="36" rx="3" fill="#8A7B58"/>
  <text class="bt" x="568" y="183">Product Mindset - operating philosophy</text>

  <rect x="60" y="430" width="1016" height="54" rx="3" fill="#D9465A"/>
  <text class="bt" x="568" y="452">Value Streams - common spine</text>
  <text class="bt" x="568" y="472">pre-existing business workflows and capabilities through which value is created and delivered</text>

  <!-- dashed: Product Mindset above each framework; Value Streams below each framework -->
  <path class="dg" d="M156,196 V260"/>
  <path class="dg" d="M568,196 V260"/>
  <path class="dg" d="M980,196 V260"/>
  <path class="dr" d="M156,360 V430"/>
  <path class="dr" d="M568,360 V430"/>
  <path class="dr" d="M980,360 V430"/>

  <!-- ===================== FLOWS ===================== -->

  <!-- OSM -> PTS: value priorities (README: "PTS is where OSM's strategic intent, value priorities, and value streams are structured") -->
  <path class="work" d="M252,293.3 H468"/>
  <text class="lbl" x="362" y="286">value priorities</text>
  <!-- PTS -> OSM: value-stream outcomes and strategic signals (CVDM loop 5, consolidated by the product team) -->
  <path class="fb" d="M472,326.7 H256"/>
  <text class="lblf" x="362" y="345">value-stream outcomes</text>
  <text class="lblf" x="362" y="361">&amp; strategic signals</text>

  <!-- PTS -> CVDM: product teams -->
  <path class="work" d="M664,293.3 H880"/>
  <text class="lbl" x="774" y="286">product teams</text>
  <!-- CVDM -> PTS: customer outcomes -->
  <path class="fb" d="M884,326.7 H668"/>
  <text class="lblf" x="774" y="345">customer outcomes</text>

  <!-- ===================== FRAMEWORKS ===================== -->

  <rect x="60" y="260" width="192" height="100" rx="3" fill="#3FAF9C"/>
  <text class="bh" x="156" y="286">OSM</text>
  <text class="bt" x="156" y="306">Strategic Value Creation</text>
  <text class="bt" x="156" y="325">Organization, Enterprise/</text>
  <text class="bt" x="156" y="343">Function, Portfolio</text>

  <rect x="472" y="260" width="192" height="100" rx="3" fill="#E57E2C"/>
  <text class="bh" x="568" y="296">PTS</text>
  <text class="bt" x="568" y="316">Structured, Empowered,</text>
  <text class="bt" x="568" y="334">Executed</text>

  <rect x="884" y="260" width="192" height="100" rx="3" fill="#2E7867"/>
  <text class="bh" x="980" y="296">CVDM</text>
  <text class="bt" x="980" y="316">Practiced, Tested,</text>
  <text class="bt" x="980" y="334">Reinforced</text>

  <text x="568" y="526" font-size="13" fill="#2E3A46" text-anchor="middle">© 2026 Insheights LLC. All rights reserved.</text>
</svg>
