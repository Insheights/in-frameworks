<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Integrated Value Creation System</title>
  <!--
    Layout
    - Product Mindset band (top) and Value Streams band (bottom) span x=60..940.
    - Framework boxes are 192 wide: OSM x=60 (upper row, y=240..340), PTS x=404 and CVDM x=748 (y=400..480).
    - Dashed lines: Product Mindset (grey) above each framework; Value Streams (red) below each framework.
    - OSM bottom points (quarters): 108 Value Streams, 156 value stream outcome (in), 204 value priorities (out).
      PTS / CVDM side pairs at y=426.7 (work) and 453.3 (feedback).
    - Grey = work flow, blue = feedback flow; labels above work lines and below feedback lines.
  -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DCE2E8"/>
    </pattern>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8591"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A87D9"/>
    </marker>
    <style>
      .work  { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ag); }
      .fb    { fill: none; stroke: #3A87D9; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ab); }
      .dg    { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .dr    { fill: none; stroke: #D9465A; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .lbl   { font-size: 13px; fill: #3B4652; text-anchor: middle; }
      .lblf  { font-size: 13px; fill: #3B4652; font-style: italic; text-anchor: middle; }
      .bh    { font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .bt    { font-size: 13px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="660" fill="#F1F4F7"/>
  <rect width="1000" height="660" fill="url(#dots)"/>

  <!-- title -->
  <text x="60" y="40" font-size="20" font-weight="700" fill="#2E3A46">Integrated Value Creation System</text>
  <text x="60" y="66" font-size="15" fill="#3B4652">OSM | PTS | CVDM</text>
  <text x="60" y="88" font-size="12.5" fill="#3B4652">The Insheights Integrated Value Creation System is how organizations define, build, and deliver value — from</text>
  <text x="60" y="106" font-size="12.5" fill="#3B4652">strategic intent to value — integrating existing practices into a coherent system.</text>

  <!-- legend: top-right, same spot as the other diagrams -->
  <text x="860" y="34" font-size="12" fill="#3B4652">work flow</text>
  <path class="work" d="M860,44 H960"/>
  <text x="860" y="70" font-size="12" fill="#3B4652" font-style="italic">feedback flow</text>
  <path class="fb" d="M860,80 H960"/>

  <!-- ===================== BANDS ===================== -->

  <rect x="60" y="150" width="880" height="36" rx="3" fill="#7A8591"/>
  <text class="bt" x="500" y="173">Product Mindset - operating philosophy</text>

  <rect x="60" y="540" width="880" height="54" rx="3" fill="#D9465A"/>
  <text class="bt" x="500" y="562">Value Streams - common spine</text>
  <text class="bt" x="500" y="582">pre-existing business workflows and capabilities through which value is created and delivered</text>

  <!-- dashed: Product Mindset above each framework; Value Streams below each framework -->
  <path class="dg" d="M156,186 V240"/>
  <path class="dg" d="M500,186 V400"/>
  <path class="dg" d="M844,186 V400"/>
  <path class="dr" d="M108,340 V540"/>
  <path class="dr" d="M500,480 V540"/>
  <path class="dr" d="M844,480 V540"/>

  <!-- ===================== FLOWS ===================== -->

  <!-- OSM -> PTS: value priorities (README: "PTS is where OSM's strategic intent, value priorities, and value streams are structured") -->
  <path class="work" d="M204,340 V426.7 H400"/>
  <text class="lbl" x="328" y="420">value priorities</text>
  <!-- PTS -> OSM: value stream outcome -->
  <path class="fb" d="M404,453.3 H156 V344"/>
  <text class="lblf" x="328" y="471">value stream outcome</text>

  <!-- PTS -> CVDM: product teams -->
  <path class="work" d="M596,426.7 H744"/>
  <text class="lbl" x="672" y="420">product teams</text>
  <!-- CVDM -> PTS: customer outcome -->
  <path class="fb" d="M748,453.3 H600"/>
  <text class="lblf" x="672" y="471">customer outcome</text>

  <!-- ===================== FRAMEWORKS ===================== -->

  <rect x="60" y="240" width="192" height="100" rx="3" fill="#3FAF9C"/>
  <text class="bh" x="156" y="266">OSM</text>
  <text class="bt" x="156" y="286">Strategic Value Creation</text>
  <text class="bt" x="156" y="305">Organization, Enterprise/</text>
  <text class="bt" x="156" y="323">Function, Portfolio</text>

  <rect x="404" y="400" width="192" height="80" rx="3" fill="#E57E2C"/>
  <text class="bh" x="500" y="426">PTS</text>
  <text class="bt" x="500" y="446">Structured, Empowered,</text>
  <text class="bt" x="500" y="464">Executed</text>

  <rect x="748" y="400" width="192" height="80" rx="3" fill="#2E7867"/>
  <text class="bh" x="844" y="426">CVDM</text>
  <text class="bt" x="844" y="446">Practiced, Tested,</text>
  <text class="bt" x="844" y="464">Reinforced</text>

  <text x="500" y="636" font-size="13" fill="#2E3A46" text-anchor="middle">© 2026 Insheights LLC. All rights reserved.</text>
</svg>
