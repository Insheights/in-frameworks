<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>8-Values Compounding Effect Model</title>
  <!--
    Layout
    - Boxes are 192 x 48. Row 3 columns at x=60, 320, 580, 840 (People, Operational, Customer, Market);
      the centre column x=450..642 (Strategic, Financial, Impact) sits between Operational and Customer;
      Innovation sits above People.
    - Rows: y=150 (Strategic), 260 (Innovation, Financial), 370 (row 3), 480 (Impact).
    - Connection points are evenly spaced per edge.
    - Relationships follow 8-values.md "Compounding Relationships":
      solid = direct, continuous; dashed = indirect, episodic; two heads = bidirectional.
  -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DCE2E8"/>
    </pattern>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8591"/>
    </marker>
    <style>
      .one  { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ag); }
      .two  { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-linejoin: round; marker-start: url(#ag); marker-end: url(#ag); }
      .dash { stroke-dasharray: 9 6; }
      .box  { fill: #FFFFFF; }
      .bt   { font-size: 13px; fill: #2E3A46; text-anchor: middle; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1100" height="610" fill="#F1F4F7"/>
  <rect width="1100" height="610" fill="url(#dots)"/>

  <!-- title -->
  <text x="60" y="40" font-size="20" font-weight="700" fill="#2E3A46">8-Values Compounding Effect Model</text>

  <!-- legend: top-right, same spot as the other diagrams -->
  <text x="860" y="34" font-size="12" fill="#3B4652">continuous compounding effect</text>
  <path class="one" d="M860,44 H960"/>
  <text x="860" y="70" font-size="12" fill="#3B4652">episodic compounding effect</text>
  <path class="one dash" d="M860,80 H960"/>

  <!-- ===================== RELATIONSHIPS ===================== -->

  <!-- Strategic <-> Innovation -->
  <path class="two" d="M156,256 V174 H446"/>
  <!-- Strategic <-> Market -->
  <path class="two" d="M646,174 H936 V366"/>
  <!-- Strategic <-> Financial -->
  <path class="two" d="M546,202 V256"/>
  <!-- Innovation <-> Financial (dashed: indirect, episodic) -->
  <path class="two dash" d="M256,284 H446"/>

  <!-- People -> Innovation; People -> Operational -->
  <path class="one" d="M156,370 V312"/>
  <path class="one" d="M252,394 H316"/>
  <!-- Operational <-> Customer -->
  <path class="two" d="M516,394 H576"/>
  <!-- Customer -> Market -->
  <path class="one" d="M772,394 H836"/>

  <!-- Operational -> Strategic (Operational top 384 -> Strategic bottom 498) -->
  <path class="one" d="M384,370 V229 H498 V202"/>
  <!-- Operational <-> Financial (Operational top 448 -> Financial bottom 514) -->
  <path class="two" d="M448,366 V339 H514 V312"/>
  <!-- Customer -> Financial (Customer top 644 -> Financial bottom 578) -->
  <path class="one" d="M644,370 V339 H578 V312"/>
  <!-- Customer -> Strategic (Customer top 708 -> Strategic bottom 594) -->
  <path class="one" d="M708,370 V229 H594 V202"/>

  <!-- Operational -> Impact (Operational bottom 416 -> Impact top 514) -->
  <path class="one" d="M416,418 V449 H514 V476"/>
  <!-- Customer <-> Impact (Customer bottom 676 -> Impact top 578) -->
  <path class="two" d="M676,422 V449 H578 V476"/>
  <!-- People <-> Impact -->
  <path class="two" d="M156,422 V504 H446"/>
  <!-- Market <-> Impact -->
  <path class="two" d="M936,422 V504 H646"/>

  <!-- ===================== VALUES (192 x 48) ===================== -->

  <rect class="box" x="450" y="150" width="192" height="48" rx="3"/>
  <text class="bt" x="546" y="179">Strategic Value</text>

  <rect class="box" x="60" y="260" width="192" height="48" rx="3"/>
  <text class="bt" x="156" y="289">Innovation Value</text>

  <rect class="box" x="450" y="260" width="192" height="48" rx="3"/>
  <text class="bt" x="546" y="289">Financial Value</text>

  <rect class="box" x="60" y="370" width="192" height="48" rx="3"/>
  <text class="bt" x="156" y="399">People Value</text>

  <rect class="box" x="320" y="370" width="192" height="48" rx="3"/>
  <text class="bt" x="416" y="399">Operational Value</text>

  <rect class="box" x="580" y="370" width="192" height="48" rx="3"/>
  <text class="bt" x="676" y="399">Customer Value</text>

  <rect class="box" x="840" y="370" width="192" height="48" rx="3"/>
  <text class="bt" x="936" y="399">Market Value</text>

  <rect class="box" x="450" y="480" width="192" height="48" rx="3"/>
  <text class="bt" x="546" y="509">Impact Value</text>

  <text x="546" y="584" font-size="13" fill="#2E3A46" text-anchor="middle">© 2026 Insheights LLC. All rights reserved.</text>
</svg>
