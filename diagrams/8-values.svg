<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>8-Values Compounding Effect Model</title>
  <!--
    Layout
    - Boxes are 192 x 48. Row 3 columns at x=60, 380, 700, 1020 (People, Operational, Customer, Market), 128 apart;
      the centre column x=540..732 (Strategic, Financial, Impact) sits between Operational and Customer;
      Innovation sits above People.
    - Rows: y=150 (Strategic), 290 (Innovation, Financial), 470 (row 3), 610 (Impact).
    - Relationships follow 8-values.md "Compounding Relationships":
      solid = direct, continuous; dashed = indirect, episodic; one head = one-way; two heads = two-way.
    - Labels: one-way arrows carry a verb (source -> target); two-way arrows name what passes both ways.
  -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DCE2E8"/>
    </pattern>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8591"/>
    </marker>
    <style>
      .one  { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ag); }
      .two  { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-linejoin: round; marker-start: url(#ag); marker-end: url(#ag); }
      .dash { stroke-dasharray: 9 6; }
      .box  { fill: #FFFFFF; }
      .bt   { font-size: 13px; fill: #2E3A46; text-anchor: middle; }
      .lbl  { font-size: 13px; fill: #3B4652; }
      .mid  { text-anchor: middle; }
      .end  { text-anchor: end; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="740" fill="#F1F4F7"/>
  <rect width="1280" height="740" fill="url(#dots)"/>

  <!-- title -->
  <text x="60" y="40" font-size="20" font-weight="700" fill="#2E3A46">8-Values Compounding Effect Model</text>

  <!-- legend: top-right, same spot as the other diagrams -->
  <text x="1080" y="34" font-size="12" fill="#3B4652">one-way effect</text>
  <path class="one" d="M1080,44 H1200"/>
  <text x="1080" y="70" font-size="12" fill="#3B4652">two-way effect</text>
  <path class="two" d="M1084,80 H1200"/>
  <text x="1080" y="106" font-size="12" fill="#3B4652">episodic effect</text>
  <path class="two dash" d="M1084,116 H1200"/>

  <!-- ===================== RELATIONSHIPS ===================== -->

  <!-- Strategic <-> Innovation -->
  <path class="two" d="M156,286 V174 H536"/>
  <text class="lbl mid" x="346" y="166">strategic options</text>
  <!-- Strategic <-> Market -->
  <path class="two" d="M736,174 H1116 V466"/>
  <text class="lbl mid" x="926" y="166">positioning</text>
  <!-- Strategic <-> Financial -->
  <path class="two" d="M636,202 V286"/>
  <text class="lbl" x="646" y="266">capital allocation</text>
  <!-- Innovation <-> Financial (dashed: indirect, episodic) -->
  <path class="two dash" d="M256,314 H536"/>
  <text class="lbl mid" x="334" y="306">investment</text>

  <!-- Operational -> Strategic; Customer -> Strategic -->
  <path class="one" d="M412,470 V230 H588 V202"/>
  <text class="lbl mid" x="500" y="222">informs feasibility</text>
  <path class="one" d="M860,470 V230 H684 V202"/>
  <text class="lbl mid" x="772" y="222">validates</text>

  <!-- Financial <-> Operational; Customer -> Financial -->
  <path class="two" d="M508,466 V390 H588 V342"/>
  <text class="lbl end" x="578" y="380">investment</text>
  <path class="one" d="M764,470 V390 H684 V342"/>
  <text class="lbl" x="694" y="380">generates revenue</text>

  <!-- People -> Innovation; People -> Operational -->
  <path class="one" d="M156,470 V342"/>
  <text class="lbl" x="166" y="410">enables</text>
  <path class="one" d="M252,494 H376"/>
  <text class="lbl mid" x="312" y="486">enables</text>
  <!-- Operational <-> Customer -->
  <path class="two" d="M576,494 H696"/>
  <text class="lbl mid" x="636" y="470">delivery &amp;</text>
  <text class="lbl mid" x="636" y="486">demand</text>
  <!-- Customer -> Market -->
  <path class="one" d="M892,494 H1016"/>
  <text class="lbl mid" x="952" y="470">builds</text>
  <text class="lbl mid" x="952" y="486">reputation</text>

  <!-- Operational -> Impact; Customer <-> Impact -->
  <path class="one" d="M476,518 V560 H588 V606"/>
  <text class="lbl mid" x="532" y="552">creates</text>
  <path class="two" d="M796,522 V560 H684 V606"/>
  <text class="lbl" x="694" y="584">benefit &amp; loyalty</text>
  <!-- People <-> Impact; Market <-> Impact -->
  <path class="two" d="M156,522 V634 H536"/>
  <text class="lbl mid" x="346" y="626">purpose</text>
  <path class="two" d="M1116,522 V634 H736"/>
  <text class="lbl mid" x="926" y="626">reputation &amp; reach</text>

  <!-- ===================== VALUES (192 x 48) ===================== -->

  <rect class="box" x="540" y="150" width="192" height="48" rx="3"/>
  <text class="bt" x="636" y="179">Strategic Value</text>

  <rect class="box" x="60" y="290" width="192" height="48" rx="3"/>
  <text class="bt" x="156" y="319">Innovation Value</text>

  <rect class="box" x="540" y="290" width="192" height="48" rx="3"/>
  <text class="bt" x="636" y="319">Financial Value</text>

  <rect class="box" x="60" y="470" width="192" height="48" rx="3"/>
  <text class="bt" x="156" y="499">People Value</text>

  <rect class="box" x="380" y="470" width="192" height="48" rx="3"/>
  <text class="bt" x="476" y="499">Operational Value</text>

  <rect class="box" x="700" y="470" width="192" height="48" rx="3"/>
  <text class="bt" x="796" y="499">Customer Value</text>

  <rect class="box" x="1020" y="470" width="192" height="48" rx="3"/>
  <text class="bt" x="1116" y="499">Market Value</text>

  <rect class="box" x="540" y="610" width="192" height="48" rx="3"/>
  <text class="bt" x="636" y="639">Impact Value</text>

  <text x="636" y="712" font-size="13" fill="#2E3A46" text-anchor="middle">© 2026 Insheights LLC. All rights reserved.</text>
</svg>
