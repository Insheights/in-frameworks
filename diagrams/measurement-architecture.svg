<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Insheights Measurement Architecture</title>
  <!--
    Layout
    - Side boxes are 192 wide: customer side on the left (x=40), organization / architecture side on the right (x=928).
    - Centre column x=340..820: 3E, the AER bridge, 8 Values (captioned Value Generated, so "Lagging" means only 3E Effectiveness).
    - 3E is split as in 3e.md: Lagging = Effectiveness (x=370..562, beside Outcomes, which it measures);
      Leading = Efficiency, Experience (x=598..790).
    - AER (the bridge) is split the same way into its two tracks: Customer x=370..562, Organization x=598..790.
    - Every arrow meets the outer 3E / AER / 8 Values box, not an inner box.
    - Grey = work flow (verb), as in the other diagrams; this diagram has no feedback flows.
  -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DCE2E8"/>
    </pattern>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8591"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A87D9"/>
    </marker>
    <style>
      .work { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ag); }
      .fb   { fill: none; stroke: #3A87D9; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#ab); }
      .line { fill: none; stroke: #7A8591; stroke-width: 2.5; stroke-linejoin: round; }
      .lbl  { font-size: 13px; fill: #3B4652; }
      .lblf { font-size: 13px; fill: #2F6FB5; font-style: italic; }
      .box  { fill: #FFFFFF; }
      .h    { font-size: 14px; font-weight: 700; fill: #2E3A46; text-anchor: middle; }
      .t    { font-size: 13px; fill: #2E3A46; text-anchor: middle; }
      .bh   { font-size: 14px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .bt   { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .cap  { font-size: 12px; fill: #3B4652; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1160" height="690" fill="#F1F4F7"/>
  <rect width="1160" height="690" fill="url(#dots)"/>

  <!-- title -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#2E3A46">Insheights Measurement Architecture</text>

  <!-- legend: top-right, same layout as the other diagrams -->
  <text x="1020" y="34" font-size="12" fill="#3B4652">work flow</text>
  <path class="work" d="M1020,44 H1120"/>

  <!-- ===================== ROW 1: 3E (raised 16px to give the 3E -> AER arrow room for its label) ===================== -->
  <g transform="translate(0,-16)">

  <text class="cap" x="820" y="110" text-anchor="end">Delivery</text>
  <rect x="340" y="118" width="480" height="138" rx="3" fill="#C5D0DA"/>
  <text class="h" x="580" y="140">3E</text>

  <rect class="box" x="370" y="150" width="192" height="86" rx="3"/>
  <text class="h" x="466" y="184">Lagging</text>
  <text class="t" x="466" y="206">Effectiveness (achieve)</text>

  <rect class="box" x="598" y="150" width="192" height="86" rx="3"/>
  <text class="h" x="694" y="174">Leading</text>
  <text class="t" x="694" y="196">Efficiency (use)</text>
  <text class="t" x="694" y="216">Experience (feel)</text>

  <!-- left: outcomes (customer, organization, value stream), measured by Effectiveness -->
  <rect class="box" x="40" y="145" width="192" height="96" rx="3"/>
  <text class="t" x="136" y="198">Outcomes</text>
  <path class="work" d="M232,193 H336"/>
  <text class="lbl" x="280" y="185" text-anchor="middle">measured by</text>

  <!-- right: the architecture elements, measured by all of 3E -->
  <text class="cap" x="1120" y="135" text-anchor="end">Architecture Elements</text>
  <rect class="box" x="928" y="145" width="192" height="96" rx="3"/>
  <text class="t" x="1024" y="177">Process | Capability |</text>
  <text class="t" x="1024" y="197">Value Stage | Value Stream |</text>
  <text class="t" x="1024" y="217">Product/Service</text>
  <path class="work" d="M928,193 H824"/>
  <text class="lbl" x="880" y="185" text-anchor="middle">measured by</text>

  </g>

  <!-- ===================== ROW 2: the AER bridge ===================== -->

  <text class="cap" x="820" y="284" text-anchor="end">Bridge</text>
  <rect x="340" y="292" width="480" height="162" rx="3" fill="#F5C125"/>

  <text class="h" x="580" y="314">AER</text>

  <rect class="box" x="370" y="326" width="192" height="104" rx="3"/>
  <text class="h" x="466" y="352">Customer</text>
  <text class="t" x="466" y="374">Adoption</text>
  <text class="t" x="466" y="394">Engagement</text>
  <text class="t" x="466" y="414">Retention</text>

  <rect class="box" x="598" y="326" width="192" height="104" rx="3"/>
  <text class="h" x="694" y="352">Organization</text>
  <text class="t" x="694" y="374">Adoption</text>
  <text class="t" x="694" y="394">Engagement</text>
  <text class="t" x="694" y="414">Retention</text>

  <!-- 3E is expected to lead AER (both tracks): Efficiency toward Adoption, Experience toward Engagement, Effectiveness toward Retention -->
  <path class="work" d="M580,240 V288"/>
  <text class="lbl" x="588" y="266">expected to lead</text>

  <!-- side inputs: the behavioral signal each AER track measures -->
  <rect class="box" x="40" y="322" width="192" height="96" rx="3"/>
  <text class="t" x="136" y="364">Customer Journey</text>
  <text class="t" x="136" y="384">Steps</text>
  <path class="work" d="M232,370 H336"/>
  <text class="lbl" x="284" y="362" text-anchor="middle">feed</text>

  <rect class="box" x="928" y="322" width="192" height="96" rx="3"/>
  <text class="t" x="1024" y="354">Product Team &amp;</text>
  <text class="t" x="1024" y="374">Product Operating</text>
  <text class="t" x="1024" y="394">Model</text>
  <path class="work" d="M928,370 H824"/>
  <text class="lbl" x="878" y="362" text-anchor="middle">feed</text>

  <!-- AER is expected to lead the 8 Values -->
  <path class="work" d="M580,454 V516"/>
  <text class="lbl" x="588" y="490">expected to lead</text>

  <!-- ===================== ROW 3: 8 Values ===================== -->

  <text class="cap" x="820" y="510" text-anchor="end">Value Generated</text>
  <rect class="box" x="340" y="520" width="480" height="96" rx="3"/>
  <text class="h" x="580" y="552">8 Values</text>
  <text class="t" x="580" y="574">Strategic | Financial | Market | Innovation</text>
  <text class="t" x="580" y="594">People | Operational | Customer | Impact</text>

  <text x="580" y="666" font-size="13" fill="#2E3A46" text-anchor="middle">© 2026 Insheights LLC. All rights reserved.</text>
</svg>
